<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Novabird-phishing</title>
<style>
  /* Stil wie die Overlays der übrigen NovaBird-Add-ons (novabird-send): Karte, Palette, Knöpfe */
  :root {
    --sp-bg: #e6ecf5; --sp-fg: #1e2838; --sp-border: #d2dae6; --sp-accent: #2f6bd8; --sp-muted: #6a7280;
    --sp-on-accent: #ffffff; --sp-card: #f4f7fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sp-bg: #1d1e22; --sp-fg: #dadde3; --sp-border: #2a2c31; --sp-accent: #5b9dff; --sp-muted: #9aa0ae;
      --sp-on-accent: #0e1116; --sp-card: #25272c;
    }
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--sp-bg); color: var(--sp-fg); font: menu; font-size: 13px; }
  .box {
    box-sizing: border-box; min-height: 100%; padding: 18px 20px 16px;
    border-left: 4px solid var(--sp-accent); display: flex; flex-direction: column; gap: 12px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  p { margin: 0; line-height: 1.45; }
  .muted { color: var(--sp-muted); font-size: 12px; }
  .books {
    background: var(--sp-card); border: 1px solid var(--sp-border); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(20, 40, 80, 0.10); padding: 6px 4px; max-height: 210px; overflow: auto;
  }
  .books label { display: flex; align-items: flex-start; gap: 8px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .books label:hover { background: color-mix(in srgb, var(--sp-accent) 8%, transparent); }
  .books input { margin: 2px 0 0; accent-color: var(--sp-accent); }
  .books .hint { display: block; color: var(--sp-muted); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: auto; }
  .row .status { flex: 1; color: var(--sp-muted); font-size: 12px; }
  button {
    font: inherit; border-radius: 6px; padding: 5px 14px; cursor: pointer;
    border: 1px solid var(--sp-border); background: transparent; color: var(--sp-fg);
  }
  button.primary { background: var(--sp-accent); border-color: var(--sp-accent); color: var(--sp-on-accent); font-weight: 600; padding: 5px 16px; }
  button:focus-visible { outline: 2px solid var(--sp-accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title"></h1>
  <p id="intro"></p>
  <div class="books" id="books"></div>
  <p class="muted" id="hint"></p>
  <p class="muted" id="scan"></p>
  <div class="row">
    <span class="status" id="status"></span>
    <button id="more" type="button"></button>
    <button id="save" type="button" class="primary"></button>
  </div>
</div>
<script type="module" src="onboarding.js"></script>
</body>
</html>
